<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVRP Radio UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Radio Container -->
    <div id="radio-container">
        
        <!-- Top Deck: Houses Antenna and Knobs at the Top -->
        <div class="radio-top-deck">
            <div class="knob power-knob" id="power-knob"></div>
            <div class="knob selector-knob"></div>
            <div class="antenna"></div>
        </div>

        <!-- Radio Body Chassis -->
        <div class="radio-body">
            <div class="brand-label">SVRP RADIO</div>
            
            <div class="radio-screen" id="radio-screen">
                <div class="apx-status-top">
                    <span id="power-status" class="apx-power-indicator">OFF</span>
                    <span id="volume-display">Vol: 30%</span>
                </div>
                <div class="apx-main-display">
                    <div class="apx-zone-text">ZONE 1</div>
                    <div id="channel-display" class="apx-channel-text">---</div>
                    
                    <!-- Hidden input container for direct typing -->
                    <div id="inline-input-container" class="inline-input-container hidden">
                        <span class="input-prompt">CH:</span>
                        <input type="text" id="channel-input" class="inline-channel-input" maxlength="4">
                    </div>
                </div>
                <div class="apx-bottom-bar">
                    <span id="screen-hint"></span>
                    <span>APX-8000</span>
                    <!-- Settings Gear Icon -->
                    <span id="settings-btn" style="cursor: pointer; margin-left: auto; padding-left: 6px;">⚙️</span>
                </div>
            </div>

            <!-- Keypad Area -->
            <div class="radio-keypad-area">
                <div class="num-grid">
                    <button class="num-btn" data-value="1">1</button>
                    <button class="num-btn" data-value="2">2</button>
                    <button class="num-btn" data-value="3">3</button>
                    <button class="num-btn" data-value="4">4</button>
                    <button class="num-btn" data-value="5">5</button>
                    <button class="num-btn" data-value="6">6</button>
                    <button class="num-btn" data-value="7">7</button>
                    <button class="num-btn" data-value="8">8</button>
                    <button class="num-btn" data-value="9">9</button>
                    <button class="num-btn" data-value="DEL">DEL<span>CLR</span></button>
                    <button class="num-btn" data-value="0">0</button>
                    <button class="num-btn" data-value="OK">OK<span>ENT</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal Overlay -->
    <div id="settings-modal" class="settings-modal hidden">
        <div class="settings-content">
            <h3>Radio Settings</h3>
            <label>Push-To-Talk (PTT) Key:</label>
            <button id="ptt-key-btn" class="ptt-btn">Press any key...</button>
            <div class="settings-buttons">
                <button id="save-settings" class="num-btn" style="width: 100%;">Save & Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
